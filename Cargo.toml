[package]
name = "live-ship"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = "1.18.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1.10", features = ["v4", "serde"] }
rfd = "0.17.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[build-dependencies]
slint-build = "1.18.1"
